name: Build ILAINA-Viewer Windows EXEs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'packed/**'
      - 'packed_v5/**'
      - 'patches/**'
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack and verify ILAINA-Viewer source
        shell: pwsh
        run: |
          @'
          import base64, hashlib, io, pathlib, tarfile
          base = pathlib.Path('packed')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in sorted(base.glob('p*.txt')))
          archive = base64.b64decode(encoded, validate=True)
          expected = '4e6234d1bd224aec5c0e17d2cf11714e744c98cecc2cd7014a74d3447484346b'
          assert hashlib.sha256(archive).hexdigest() == expected, 'Source archive integrity check failed'
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tf:
              for m in tf.getmembers():
                  dest = pathlib.PurePosixPath(m.name)
                  assert dest.parts[0] == 'desktop' and not dest.is_absolute() and '..' not in dest.parts
              tf.extractall(path='.', filter='data')
          print('Verified source unpacked')
          '@ | python -
      - name: Install Python dependencies and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt "pyinstaller>=6.10,<7"
      - name: Enable one-click Customer without login
        shell: pwsh
        run: python patches/enable_guest.py
      - name: Enable compact Admin / Customer V4
        shell: pwsh
        run: python patches/enable_compact_v4.py
      - name: Unpack and verify V5 dedicated viewer and reconnect transport
        shell: pwsh
        run: |
          @'
          import base64, hashlib, io, pathlib, tarfile
          parts = pathlib.Path('packed_v5')
          b64 = ''.join(f.read_text(encoding='ascii').strip() for f in sorted(parts.glob('p*.txt')))
          raw = base64.b64decode(b64, validate=True)
          assert hashlib.sha256(raw).hexdigest() == '78891f18ca5fd18c4987086fd040411badbfd82863f7fc227619f8b88794e447', 'V5 SHA-256 mismatch'
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as tf:
              for m in tf.getmembers():
                  dest=pathlib.PurePosixPath(m.name)
                  assert dest.parts[0]=='desktop' and not dest.is_absolute() and '..' not in dest.parts
              tf.extractall(path='.',filter='data')
          print('Verified V5 Windows code unpacked')
          '@ | python -
      - name: Check Python syntax
        shell: pwsh
        run: python -m py_compile desktop/admin.py desktop/customer.py desktop/common.py
      - name: Generate custom ILAINA Viewer ICO
        shell: pwsh
        run: |
          @'
          from PIL import Image, ImageDraw, ImageFont
          image=Image.new('RGBA',(256,256),'#0B1220')
          draw=ImageDraw.Draw(image)
          draw.rounded_rectangle((14,14,242,242),radius=48,fill='#141F31',outline='#30E6B0',width=8)
          draw.polygon([(128,47),(202,128),(128,209),(54,128)],outline='#30E6B0',width=12)
          draw.ellipse((112,112,144,144),fill='#30E6B0')
          image.save('desktop/ILAINA-Viewer.ico',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
      - name: Build Admin EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name ILAINA-Viewer-Admin --paths desktop --icon desktop/ILAINA-Viewer.ico --collect-submodules PIL desktop/admin.py
      - name: Build Customer EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name ILAINA-Viewer-Customer --paths desktop --collect-submodules mss --icon desktop/ILAINA-Viewer.ico --collect-submodules pynput desktop/customer.py
      - name: Zip separate Windows apps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release/admin","release/customer" | Out-Null
          Copy-Item "dist/ILAINA-Viewer-Admin.exe" "release/admin/"
          Copy-Item "desktop/config-admin.json" "release/admin/"
          Copy-Item "dist/ILAINA-Viewer-Customer.exe" "release/customer/"
          Copy-Item "desktop/config-customer.json" "release/customer/"
          Compress-Archive "release/admin/*" "release/ILAINA-Viewer-Admin.zip" -Force
          Compress-Archive "release/customer/*" "release/ILAINA-Viewer-Customer.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ILAINA-Viewer-V5-Windows-EXEs
          path: |
            release/ILAINA-Viewer-Admin.zip
            release/ILAINA-Viewer-Customer.zip
          if-no-files-found: error
          retention-days: 30
